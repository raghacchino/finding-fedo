<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finding Fedo</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./assets/icon.ico">
</head>

<body>
    <main class="hero">
        <div class="hero-design">
            <div class="paw paw-1">
                <img src="./assets/paw-1.png" alt="">
            </div>
            <div class="center-pup">
                <img src="./assets/hero-center-img.jpg" alt="">
                <p>Finding Fedo</p>
            </div>
            <div class="paw paw-2">
                <img src="./assets/paw-2.png" alt="">
            </div>
        </div>
        <button class="play-btn" id="playBtn">Play</button>
    </main>

    <div class="start" id="startModel">
        <div class="speech">
            <img src="./assets/animal1.png" alt="">
            <p>Hi! I'm Fedo.
                <br> I like hiding. Try to find me, I bet you can't. (*evil laugh)</p>
        </div>
    </div>

    <div class="game">
        <div class="score">
            <img src="./assets/treat.png" alt="">
            <p id="scoreCounter">00</p>
        </div>

        <div class="cupboards">
            <div class="cupboard" id="cupboard1">
                <img src="./assets/cupboard-close.png" alt="" class="cupboard-img1">
                <div class="animal" id="animal1">
                    <img src="./assets/animal1.png" class="animals animals1" alt="">
                </div>
            </div>
            <div class="cupboard" id="cupboard2">
                <img src="./assets/cupboard-close.png" alt="" class="cupboard-img2">
                <div class="animal" id="animal2">
                    <img src="./assets/animal2.png" class="animals animals2" alt="">
                </div>
            </div>
            <div class="cupboard" id="cupboard3">
                <img src="./assets/cupboard-close.png" alt="" class="cupboard-img3">
                <div class="animal" id="animal3">
                    <img src="./assets/animal3.png" class="animals animals3" alt="">
                </div>
            </div>
        </div>

        <div class="rightAnimal">
            Found Me!
        </div>
        <div class="wrongAnimal">
            I'm Not Fedo!
        </div>

        <button class="replay-btn" id="replayBtn">Next Round</button>
    </div>

    <script src="main.js"></script>
</body>

</html>
